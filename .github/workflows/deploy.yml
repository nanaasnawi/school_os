name: Continuous Deployment & Migration

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust & SQLx CLI
      uses: dtolnay/rust-toolchain@stable

    - name: Install sqlx-cli
      run: cargo install sqlx-cli --no-default-features --features native-tls,postgres

    - name: Run SQLx Migrations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -n "$DATABASE_URL" ]; then
          echo "Running database migrations..."
          sqlx migrate run --source backend/migrations
        else
          echo "WARNING: DATABASE_URL not set in secrets, skipping automated migration."
        fi

  deploy-backend:
    name: Build & Deploy Backend
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Docker Image
      run: |
        echo "Building backend container image for ${{ github.event.inputs.environment || 'staging' }}..."
        # docker build -t school-os-api:latest ./backend

  deploy-frontend:
    name: Build & Deploy Frontend
    needs: migrate-database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Next.js
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

  health-check:
    name: Verify Deployment Health
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
    - name: Check Health Endpoint
      run: |
        echo "Validating target environment health probes..."
        # curl --fail --retry 5 --retry-delay 5 ${{ secrets.DEPLOY_URL }}/health || true
