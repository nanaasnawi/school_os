version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: school_os_db
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: school_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
